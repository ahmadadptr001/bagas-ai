[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bagasai"
version = "1.1.119"
description = "bagas-ai — AI agent serbaguna, dipanggil dari terminal mana pun."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # WAJIB untuk model web/* (mayoritas katalog): jalurnya otomasi browser,
    # jadi Playwright bukan pelengkap opsional seperti dulu.
    "playwright>=1.40.0",
    # WAJIB untuk model nvidia/*: klien endpoint OpenAI-compatible di
    # llm.py. Diimpor MALAS di sana, jadi pengguna yang cuma memakai model
    # browser tak pernah membayar waktu impornya -- tapi paketnya tetap wajib
    # dipasang, karena satu /model ke nvidia/* langsung membutuhkannya dan
    # kegagalan impor di tengah sesi jauh lebih membingungkan daripada
    # dependensi yang ikut terpasang sejak awal.
    "openai>=1.30.0",
    "rich>=13.0.0",
    # WAJIB: framework TUI untuk antarmuka chat baru (textual_app.py).
    # Menggantikan prompt_toolkit sebagai motor UI utama — prompt_toolkit
    # tetap dibutuhkan sebagai fallback untuk menu setup_wizard.
    "textual>=1.0.0",
    # WAJIB: kotak chat, menu interaktif (ui/menu.py), dan seluruh line editing
    # dibangun di atasnya. Selama ini cuma kebetulan ikut terpasang lewat
    # InquirerPy — padahal InquirerPy sendiri sudah tak dipakai lagi, jadi di
    # mesin bersih impornya bisa gagal saat startup.
    "prompt_toolkit>=3.0.39",
    "pyfiglet>=1.0.0",
    # /live dan tool take_screenshot: tangkap layar lintas monitor lalu
    # kecilkan PNG sebelum dikirim ke model vision.
    "Pillow>=10.0.0",
    # Suara kabar berbahasa Indonesia yang natural (lihat suara.py). BUKAN
    # syarat mati: tanpa paket ini — atau saat laptop sedang luring — fitur
    # suaranya turun sendiri ke System.Speech bawaan Windows. Tetap didaftarkan
    # karena hasilnya jauh lebih enak didengar, dan satu-satunya suara
    # berbahasa Indonesia yang tersedia tanpa memasang paket bahasa Windows.
    "edge-tts>=6.1.0",
    # /voice — mikrofon jadi cara memberi perintah (lihat dengar.py).
    # Sama seperti edge-tts: BUKAN syarat mati. Tanpa keduanya /voice
    # menolak menyala dan menyebutkan paket mana yang kurang, sedangkan
    # sisa bagas-ai jalan seperti biasa.
    "sounddevice>=0.4.6",
    "SpeechRecognition>=3.10.0",
    "ddgs>=6.0.0",
    "python-telegram-bot>=21.0",
    # Server MCP (`bagas-ai mcp`) — sasaran tepat untuk AI. HANYA dipakai
    # perintah itu; sisanya jalan tanpa paket ini.
    "mcp>=1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    # WAJIB untuk seksi "◈ Sistem" di sidebar InfoSidebar (textual_app.py):
    # cpu/memory/disk di-poll tiap ~2 dtk. Bukan syarat mati — tanpa psutil
    # panel sistemnya kosong dan sisa app jalan normal — tapi didaftarkan
    # karena monitoring kesehatan mesin adalah fitur inti sidebar.
    "psutil>=5.9.0",
]

# Perintah global yang bisa dipanggil dari terminal mana pun.
[project.scripts]
bagas-ai = "agent.__main__:main"
bagasai = "agent.__main__:main"
bagas = "agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
